name: Validación
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: dotnet restore FinSense.Tests
      - run: dotnet build FinSense --no-restore
      - run: dotnet test FinSense.Tests --no-restore
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - run: node --check FinSense/wwwroot/app.js
